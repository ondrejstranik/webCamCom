<!DOCTYPE html>
  <html>
  <head>
      <title>ESP32 Web BLE App</title>
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <link rel="icon" type="image/jpeg" href="">
  </head>
  <style>
  .vertical-container {
    display: flex;
    flex-direction: column; /* stack children vertically */
    align-items: center;    /* center horizontally */
    gap: 10px;              /* spacing between images */
  }
  </style>
  <body>

    <canvas id='myCanvas' width='50px' height='50px'></canvas>    
    <div class="vertical-container">
        <img id="cameraStreamID" src="site-logo.jpg" alt="" />
        <img id="camera2StreamID" src="site-logo.jpg" alt="" />
        <button id='camSel' onclick='changeCam()' style='padding:10px;margin:5px;'>Camera 1 </button>
    </div>
    <p>Camera: <span id='camval'>...</span></p>
    <div style="display:flex; align-items:center; gap:10px;"></div>
      <button onclick='changeQuality(-10)' style='padding:10px;margin:5px;'>Increase Quality</button>
      <span id='qval'> JPEG Quality: ... </span>
      <button onclick='changeQuality(10)' style='padding:10px;margin:5px;'>Decrease Quality</button>
    </div>
    <div style="margin:20px;">
        <button id="autoBtn" onclick="toggleAuto()" style="padding:10px;">AUTO: ...</button>
        Exposure: <span id="expVal">...</span><br>
        <input type="range" id="expSlider" min="0" max="1200" value="0" oninput="setExposure(this.value)">
    </div>
    <div style="margin:20px;">
        FrameSize: <span id="frameVal">...</span><br>
        <input type="range" id="frameSlider" min="0" max="9" value="0" oninput="setFrame(this.value)">
    </div>


  </body>
  <script>
    // DOM Elements
    const img = document.getElementById('cameraStreamID');
    const img2 = document.getElementById('camera2StreamID');
    const cnvs = document.getElementById("myCanvas");
    const ctx = cnvs.getContext("2d");
    var moving = false;
    var c='192.168.4.1';
    var c2 = '0';
    var cMod = c; // camera to modify
    document.getElementById('camval').innerText = cMod
    var camState = 1; // state of the image 1 .. cam1, 2 .. cam 2, 3 .. cam1 and cam2
    //var c='http://esp32.local'
    //var c=document.location.origin
    let allAuto = 1;
    let exposure = 0;
    let current = 60;


    function isLandscape() {
        if (!isMobile()) return false; // desktop never swaps
        if (window.screen && window.screen.orientation && window.screen.orientation.type) {
            return window.screen.orientation.type.startsWith("landscape");
        }
        // Fallback for older browsers
        return window.innerWidth > window.innerHeight;
    }

    function transformCoordsForPhone(x, y) {
        if (isLandscape()) {
            // Swap x and y if in landscape mode
            return {x: y, y: x};
        } else {
            return {x: x, y: y};
        }
    }


    function Draw(){
      cnvs.style.position = "absolute";
      cnvs.style.left = img.offsetLeft + "px";
      cnvs.style.top = img.offsetTop + "px";
      
      var ctx = cnvs.getContext("2d");
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#00ff00';
      // circle
      ctx.beginPath();
      ctx.arc(25, 25, 24, 0, 2 * Math.PI, false);
      ctx.stroke();
      ctx.beginPath();
      // hline
      ctx.moveTo(25,0);
      ctx.lineTo(25,50);
      ctx.stroke();
      // vline
      ctx.moveTo(0,25);
      ctx.lineTo(50,25);
      ctx.stroke();
    }

    function move(e){
      var newX = e.clientX - 10;
      var newY = e.clientY - 10;

    // Swap if mobile and landscape
    // TODO: does not work
    if (isMobile() && isLandscape()) {
      image.style.left = newY + "px";
      image.style.top = newX + "px";
    } else
    {
      image.style.left = newX + "px";
      image.style.top = newY + "px";

    }
      //let pos = transformCoordsForPhone(newX, newY);

      //image.style.left = pos.x + "px";
      //image.style.top = pos.y + "px";
    }

    function initialClick(e) {
      if(moving){
        document.removeEventListener("mousemove", move);
        moving = !moving;
        return;
      }
      moving = !moving;
      image = this;
      document.addEventListener("mousemove", move, false);
    }
    // draw the cross
    Draw();
    // activate clicking
    cnvs.addEventListener("mousedown", initialClick, false);


    // activate the link to stream
    img.src=`http://${c}:81/stream`;
    document.getElementById('camSel').innerText = 'Camera ' +  camState;
    // set the parameters on screen
    refreshSecondCamera();
    refreshCameraParam();    

    
    function refreshSecondCamera() {
      fetch(`http://${c}/camera`, {mode: "cors"})
        .then(r => r.json())
        .then(d => {
          c2 = d.ipCam2;
        });
    }

    function refreshCameraParam() {
      fetch(`http://${cMod}/camera`, {mode: "cors"})
        .then(r => r.json())
        .then(d => {
          current = d.quality;
          allAuto = d.allAuto;
          exposure = d.exposure;
          currentFrame = d.framesize;
          document.getElementById('qval').innerText = current;

          // Update button text
          document.getElementById('autoBtn').innerText =
              "AUTO: " + (allAuto ? "ON" : "OFF");

          // Update slider
          document.getElementById('expSlider').value = exposure;
          document.getElementById('expVal').innerText = exposure;

          // Update frameslider
          document.getElementById('frameSlider').value = currentFrame;
          document.getElementById('frameVal').innerText = currentFrame;

        });
    }

    function changeQuality(delta) {
      current += delta;
      if(current < 10) current = 10;
      if(current > 63) current = 63;
      fetch(`http://${cMod}/camera?set=quality&value=${current}`, {mode: "cors"})
        .then(r => r.json())
        .then(d => refreshCameraParam());
    }

    function setFrame(currentFrame) {
      if(currentFrame < 0) currentFrame = 0;
      if(currentFrame > 9) currentFrame = 9;
      fetch(`http://${cMod}/camera?set=framesize&value=${currentFrame}`, {mode: "cors"})
        .then(r => r.json())
        .then(d => refreshCameraParam());
    }



    function changeCam() {
      refreshSecondCamera();
      if(c2 !='0') camState += 1;
      if(camState > 3) camState = 1;
      document.getElementById('camSel').innerText = 'Camera ' +  camState;
      if(camState==1){
        img.src=`http://${c}:81/stream`;
        img2.src=``;
        cMod = c;
      }
      if(camState==2){
        img.src=`http://${c2}:81/stream`;
        img2.src=``;
        cMod = c2;
      }
      if(camState==3){
        img.src=`http://${c}:81/stream`;
        img2.src=`http://${c2}:81/stream`;
        cMod = '0';
      }
      document.getElementById('camval').innerText = cMod
      refreshCameraParam();   
    }

    // Toggle auto / manual
    function toggleAuto() {
        let newVal = allAuto ? 0 : 1;
        fetch(`http://${cMod}/camera?set=allAuto&value=${newVal}`)
            .then(r => r.json())
            .then(() => refreshCameraParam());
    }

    // Set manual exposure
    function setExposure(val) {
        document.getElementById('expVal').innerText = val;

        fetch(`http://${cMod}/camera?set=exposure&value=${val}`)
            .then(r => r.json())
            .then(() => refreshCameraParam());
    }
    
  </script>
  </html>
