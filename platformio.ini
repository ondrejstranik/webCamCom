; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; the normal Upload builds only this one, the test build xclk10 must be chosen explicitly
default_envs = seeed_xiao_esp32s3

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
;upload_speed = 921600
; XIAO ESP32S3 native USB: some boards do not enter download mode with the
; default reset ("Wrong boot mode detected"), the USB reset works on all
board_upload.before_reset = usb_reset

; test build with half the camera clock (10 MHz instead of 20 MHz), only for a
; board that shows colored bands / stops at larger frame sizes. Upload with:
;   pio run -e xclk10 -t upload
; frame rates are halved and the exposure in ms on the page is shown too short (x0.5)
[env:xclk10]
extends = env:seeed_xiao_esp32s3
build_flags = -DXCLK_MHZ=10
